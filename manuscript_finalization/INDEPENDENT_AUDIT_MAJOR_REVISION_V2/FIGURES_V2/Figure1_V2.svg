<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Separated P0 inference and retrospective correction</text><rect x="60" y="110" width="460" height="500" rx="20" fill="#eaf2fb" stroke="#3B6FB6" stroke-width="3"/><text x="290" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">P0 inference</text><text x="290" y="205" text-anchor="middle" font-family="Arial" font-size="21">Current T1c + current segmentation</text><text x="290" y="245" text-anchor="middle" font-family="Arial" font-size="18">Channel 0: p1/p99-normalized T1c</text><text x="290" y="278" text-anchor="middle" font-family="Arial" font-size="18">Channel 1: binary current foreground</text><path d="M290 310 L290 375" stroke="#3B6FB6" stroke-width="4" marker-end="url(#a)"/><rect x="135" y="385" width="310" height="80" rx="15" fill="white" stroke="#3B6FB6" stroke-width="2"/><text x="290" y="420" text-anchor="middle" font-family="Arial" font-size="20">Frozen cross-case predictor</text><text x="290" y="450" text-anchor="middle" font-family="Arial" font-size="16">training-patient labels ≠ evaluated-case future access</text><text x="290" y="520" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Future-blind relative to evaluated-case future data</text><text x="290" y="555" text-anchor="middle" font-family="Arial" font-size="17">No future image, segmentation or target</text><rect x="680" y="110" width="460" height="500" rx="20" fill="#fff1e8" stroke="#D55E00" stroke-width="3"/><text x="910" y="155" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Retrospective PCC stage</text><text x="910" y="210" text-anchor="middle" font-family="Arial" font-size="19">P0 frozen before target access</text><text x="910" y="255" text-anchor="middle" font-family="Arial" font-size="19">T = future foreground ∧ ¬ current foreground</text><text x="910" y="295" text-anchor="middle" font-family="Arial" font-size="17">one-sided composite segmentation target</text><path d="M910 325 L910 385" stroke="#D55E00" stroke-width="4" marker-end="url(#a)"/><rect x="755" y="395" width="310" height="85" rx="15" fill="white" stroke="#D55E00" stroke-width="2"/><text x="910" y="430" text-anchor="middle" font-family="Arial" font-size="20">Prediction-Comparison-Correction</text><text x="910" y="460" text-anchor="middle" font-family="Arial" font-size="17">target-conditioned logit updates</text><text x="910" y="530" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Not prospective recurrence forecasting</text><line x1="520" y1="360" x2="680" y2="360" stroke="#222" stroke-width="4" stroke-dasharray="10,8"/><text x="600" y="335" text-anchor="middle" font-family="Arial" font-size="17">P0 SHA-256 freeze</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs></svg>
